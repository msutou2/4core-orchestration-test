<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>メモ</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>メモ</h1>
      <form id="memo-form">
        <label for="memo-body">メモ</label>
        <textarea id="memo-body" name="body" rows="5" autofocus></textarea>
        <div class="actions">
          <button type="submit" id="memo-submit">登録</button>
          <p id="create-status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading">登録したメモ</h2>
        <div id="list-status" role="status" aria-live="polite"></div>
        <ol id="memo-list"></ol>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
